function vOrga(){
  const head = `<div class="sec-head"><div><h1 class="pt"><span class="k">契</span>Gérance</h1>
    <p class="sub">Réservé à la gérance du Korin : tirage du tableau, cotes, résultats, ryos des joueurs, gérants et blacklist.</p></div></div>`;
  if (backend.mode === "live" && !backend.user){
    return head + `<div class="panel"><p>Connecte-toi avec ton compte de gérant.</p><button class="btn" data-tab="compte">Se connecter</button></div>`;
  }
  if (backend.mode === "live" && !backend.isAdmin){
    return head + `<div class="panel"><p>Connecté en tant que <b>${esc(backend.username)}</b>. Ce compte ne fait pas partie de la gérance.</p></div>`;
  }
  const n = S.teams.length;
  let size = 1; while (size < n) size *= 2;
  const drawn = S.matches.length > 0;
  const tabs = GTABS.filter(([k]) => (backend.mode === "live" || k !== "comptes") && (S.cur || !["combats", "equipes", "paris"].includes(k)));
  if (!tabs.some(([k]) => k === gTab)) gTab = "apercu";
  const nav = `<div class="row" role="tablist" aria-label="Sections de la gérance">${tabs.map(([k, l]) =>
    `<button class="btn sm ${gTab === k ? "" : "ghost"}" data-act="gtab" data-g="${k}" aria-pressed="${gTab === k}">${l}</button>`).join("")}</div>`;

  const accounts = backend.mode !== "live" ? "" : (() => {
    if (accountList === null) return `<section class="sec">${emptyBox("契", "Chargement des comptes…")}<p class="hint"><button class="btn ghost sm" data-act="load-accounts">Actualiser</button></p></section>`;
    const role = a => a.orga ? '<span class="pill p-open">Gérant</span>' : isBlacklisted(a.username) ? '<span class="pill p-closed">Blacklisté</span>' : '<span class="pill p-wait">Joueur</span>';
    const gerants = accountList.filter(a => a.orga);
    const candidats = accountList.filter(a => !a.orga && !isBlacklisted(a.username));
    const sel = accountList.find(a => a.user_id === selAcct);
    const q = nameKey(acctQ);
    const list = accountList.filter(a => !q || nameKey(a.username).includes(q));

    /* Panneau de gestion du compte choisi */
    const panel = !sel ? "" : (() => {
      const me = sel.user_id === backend.user.id, bl = isBlacklisted(sel.username);
      return `<section class="sec"><div class="panel" style="border-color:var(--gold)">
        <div class="sec-head" style="margin-bottom:12px"><div><span class="eyebrow">Gérer le compte</span><h2 style="margin-top:4px">${esc(sel.username)} ${role(sel)}</h2>
          <p class="sub">Inscrit le ${new Date(sel.created_at).toLocaleDateString("fr-FR")} · bilan <b class="${balCls(sel.balance)}">${fmtSigned(sel.balance)} 両</b></p></div>
          <button class="btn ghost sm" data-act="acct-sel" data-id="">Fermer</button></div>
        <p class="eyebrow" style="margin:0 0 6px">Bilan en ryos (après un règlement en RP)</p>
        <div class="adj" style="justify-content:flex-start;margin-bottom:16px"><input id="adj-${sel.user_id}" type="number" min="1" step="1" inputmode="numeric" placeholder="Ryos" aria-label="Montant">
          <button class="btn sm" data-act="adj" data-id="${sel.user_id}" data-sign="1">+ Créditer</button>
          <button class="btn ghost sm" data-act="adj" data-id="${sel.user_id}" data-sign="-1">− Retirer</button></div>
        <p class="eyebrow" style="margin:0 0 6px">Rôle</p>
        <div class="row" style="margin-bottom:16px">${me ? '<span class="mut">C\'est ton compte : tu ne peux pas te retirer toi-même de la gérance.</span>' : sel.orga
          ? `<button class="btn danger sm" data-act="orga" data-id="${sel.user_id}" data-on="0" data-confirm="Confirmer">Retirer de la gérance</button>`
          : `<button class="btn sm" data-act="orga" data-id="${sel.user_id}" data-on="1">Nommer gérant</button>
             ${bl ? `<span class="mut">Blacklisté : retire-le de la blacklist pour pouvoir le nommer.</span>` : `<button class="btn danger sm" data-act="bl-acct" data-name="${esc(sel.username)}" data-confirm="Confirmer">Blacklister</button>`}`}</div>
        <p class="eyebrow" style="margin:0 0 6px">Grade</p>
        <div class="adj" style="justify-content:flex-start;margin-bottom:16px">${gradeSelect("gr-" + sel.user_id, sel.grade)}
          <button class="btn ghost sm" data-act="grade-set" data-id="${sel.user_id}">Changer le grade</button></div>
        <p class="eyebrow" style="margin:0 0 6px">Mot de passe oublié</p>
        <div class="adj" style="justify-content:flex-start;margin-bottom:16px"><input id="pw-${sel.user_id}" type="text" autocomplete="off" placeholder="Nouveau mot de passe" style="width:200px" aria-label="Nouveau mot de passe">
          <button class="btn ghost sm" data-act="acct-pw" data-id="${sel.user_id}">Changer le mot de passe</button></div>
        ${me ? "" : `<p class="eyebrow" style="margin:0 0 6px">Supprimer</p>
        <div class="row"><button class="btn danger sm" data-act="acct-del" data-id="${sel.user_id}" data-confirm="Confirmer : supprimer définitivement">Supprimer le compte</button>
          <span class="mut" style="font-size:13px">Ses paris restent dans l'historique, son bilan et ses mouvements sont effacés.</span></div>`}
      </div></section>`;
    })();

    return `${panel}
    <section class="sec"><div class="sec-head"><div><h2>Gérants · ${gerants.length}</h2>
        <p class="sub">Un gérant a accès à tout l'onglet Gérance, tout de suite. À réserver aux personnes de confiance.</p></div></div>
      <div class="row" style="margin-bottom:14px">${gerants.map(a => `<button class="btn ghost sm" data-act="acct-sel" data-id="${a.user_id}">${esc(a.username)}${a.user_id === backend.user.id ? " (toi)" : ""}</button>`).join("")}</div>
      ${candidats.length ? `<form class="form" data-form="gerant" style="max-width:640px">
        <label class="f"><span class="eyebrow">Nommer un nouveau gérant</span><select id="ger-user">${candidats.map(a => `<option value="${a.user_id}">${esc(a.username)}</option>`).join("")}</select></label>
        <button class="btn" type="submit">Nommer gérant</button></form>`
        : `<p class="hint">Pour nommer quelqu'un gérant, il doit d'abord se créer un compte sur le site (onglet Connexion).</p>`}
    </section>
    <section class="sec"><div class="sec-head"><div><h2>Tous les comptes · ${accountList.length}</h2>
        <p class="sub">L'inscription est libre. Bilan négatif : le joueur doit des ryos ; positif : la gérance lui en doit. Clique sur « Gérer » pour un compte.</p></div>
        <label class="f filter"><span class="eyebrow">Chercher un nom</span><input id="acct-q" type="search" autocomplete="off" placeholder="Ex. Ryuta"></label></div>
      ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>Nom</th><th>Grade</th><th>Rôle</th><th class="num">Bilan</th><th class="num">Inscrit le</th><th></th></tr></thead><tbody>
        ${list.map(a => `<tr><td class="who">${esc(a.username)}${a.user_id === backend.user.id ? ' <span class="mut">(toi)</span>' : ""}</td><td>${a.grade ? esc(a.grade) : '<span class="mut">—</span>'}</td><td>${role(a)}</td>
          <td class="num"><b class="${balCls(a.balance)}">${fmtSigned(a.balance)}</b> 両</td><td class="num mut">${new Date(a.created_at).toLocaleDateString("fr-FR")}</td>
          <td class="num"><button class="btn ${a.user_id === selAcct ? "" : "ghost "}sm" data-act="acct-sel" data-id="${a.user_id}">Gérer</button></td></tr>`).join("")}
      </tbody></table></div>` : emptyBox("契", acctQ ? "Aucun compte ne correspond." : "Aucun compte pour l'instant.")}
    </section>`;
  })();

  const blacklist = `<section class="sec"><div class="sec-head"><div><h2><span class="k">禁</span>Blacklist du tournoi · ${S.blacklist.length}</h2>
      <p class="sub">Une personne blacklistée ne peut plus parier, ni créer de compte, ni être inscrite dans une équipe. Les majuscules et accents ne comptent pas (« Ryūta » = « ryuta »). Ses paris déjà placés restent : annule-les dans l'onglet Paris si besoin.</p></div></div>
    <form class="form" data-form="blacklist">
      <label class="f"><span class="eyebrow">Prénom et nom RP</span><input id="bl-name" maxlength="40" placeholder="Ex. Ryuta Chiiketsu" required></label>
      <label class="f"><span class="eyebrow">Motif (facultatif)</span><input id="bl-reason" maxlength="120"></label>
      <button class="btn danger" type="submit">Ajouter à la blacklist</button>
    </form>
    ${S.blacklist.length ? `<div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>Nom</th><th>Motif</th><th>Depuis le</th><th></th></tr></thead><tbody>
      ${S.blacklist.map(x => `<tr><td class="who">${esc(x.name)}</td><td class="mut">${esc(x.reason || "—")}</td>
        <td class="mut">${x.created_at ? new Date(x.created_at).toLocaleDateString("fr-FR") : ""}</td>
        <td class="num"><button class="btn ghost sm" data-act="bl-del" data-id="${x.id}" data-confirm="Confirmer">Retirer de la blacklist</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div style="margin-top:14px">${emptyBox("禁", "Personne n'est blacklisté.")}</div>`}
  </section>`;

  const manage = !drawn ? "" : (() => {
    let out = "";
    for (let r = 1; r <= totalRounds(); r++){
      const ms = S.matches.filter(m => m.round === r && !m.bye).sort((a, b) => a.slot - b.slot);
      if (!ms.length) continue;
      out += `<h3 class="eyebrow" style="margin:22px 0 10px">${esc(roundName(r))}</h3><div class="mlist">${ms.map(mrow).join("")}</div>`;
    }
    return `<section class="sec"><div class="sec-head"><div><h2>Gérer les combats</h2>
      <p class="sub">Règle les cotes, ferme les paris quand le combat commence, puis déclare le vainqueur. Les paris sont réglés automatiquement.</p></div></div>${out}</section>`;
  })();

  const combats = () => `
    <section class="sec"><div class="sec-head"><div><h2>Tirage du tableau</h2>
      <p class="sub">${plural(n, "équipe inscrite", "équipes inscrites")}${n >= 2 ? ` · tableau de ${size}${size - n ? `, ${plural(size - n, "exemption")} au premier tour` : ""}` : ""}. Les équipes s'inscrivent dans Gérance → Équipes.</p></div></div>
      <div class="panel"><p>${drawn ? "Le tableau est déjà tiré. Le retirer efface tous les combats <b>et tous les paris</b> (les mises non réglées sont rendues)." : "Le tirage place les équipes au hasard et ouvre les paris des premiers combats avec une cote de ×2,00 par défaut."}</p>
      <button class="btn${drawn ? " danger" : ""}" data-act="draw" data-confirm="${drawn ? "Confirmer : tout effacer et retirer" : "Confirmer le tirage"}" ${n < 2 ? "disabled" : ""}>${drawn ? "Retirer le tableau" : "Tirer au sort le tableau"}</button></div>
    </section>
    ${manage}
    <section class="sec"><div class="sec-head"><h2>Zone sensible</h2></div>
      <div class="panel danger-zone"><p>Réinitialiser efface les équipes, les combats et les paris. Les mises non réglées sont rendues, les soldes des joueurs sont conservés. Action définitive.</p>
      <div class="row"><button class="btn danger" data-act="reset" data-confirm="Confirmer : tout effacer">Réinitialiser le tournoi</button>
      ${backend.mode === "demo" ? `<button class="btn ghost" data-act="reseed" data-confirm="Confirmer">Recharger les données d'exemple</button>` : ""}</div></div>
    </section>`;

  const body = {apercu:gApercu, combats, equipes:gEquipes, paris:gParis, historique:gHistorique,
    comptes:() => accounts, blacklist:() => blacklist}[gTab]();
  return head + nav + body;
}

/* Sous-onglets de la gérance : tout ce qui est réservé se trouve ici, nulle part ailleurs */
let gTab = "apercu";
const GTABS = [["apercu", "Aperçu"], ["comptes", "Comptes et gérants"], ["combats", "Combats"], ["equipes", "Équipes"],
  ["paris", "Paris"], ["historique", "Historique"], ["blacklist", "Blacklist"]];

function mrow(m){
  const both = m.team_a && m.team_b;
  const meta = S.bets.filter(b => b.match_id === m.id);
  let ctl;
  if (!both) ctl = `<span class="pill p-wait">En attente des équipes</span>`;
  else if (m.status === "termine"){
    ctl = `<span class="pill p-done">Vainqueur : ${esc(tName(m.winner))}</span>
      <button class="btn ghost sm" data-act="undo" data-id="${m.id}" data-confirm="Confirmer l'annulation">Annuler le résultat</button>`;
  } else {
    ctl = `<label class="odds-in">Cote A<input id="oa-${m.id}" inputmode="decimal" value="${String(m.odds_a).replace(".", ",")}"></label>
      <label class="odds-in">Cote B<input id="ob-${m.id}" inputmode="decimal" value="${String(m.odds_b).replace(".", ",")}"></label>
      <button class="btn ghost sm" data-act="odds" data-id="${m.id}">Enregistrer les cotes</button>
      ${m.status === "ouvert" ? `<button class="btn ghost sm" data-act="status" data-id="${m.id}" data-st="ferme">Fermer les paris</button>`
        : `<button class="btn ghost sm" data-act="status" data-id="${m.id}" data-st="ouvert">Rouvrir les paris</button>`}
      <button class="btn sm" data-act="win" data-id="${m.id}" data-team="${m.team_a}" data-confirm="Confirmer">Victoire A</button>
      <button class="btn sm" data-act="win" data-id="${m.id}" data-team="${m.team_b}" data-confirm="Confirmer">Victoire B</button>`;
  }
  return `<div class="mrow"><div><div class="t">A · ${esc(tName(m.team_a))}<span class="dia">◇</span>B · ${esc(tName(m.team_b))}</div>
    <div class="meta">${pill(m)} &nbsp;${plural(meta.length, "pari")} · ${fmt(meta.reduce((s, b) => s + b.amount, 0))} ryos</div></div>
    <div class="ctl">${ctl}</div></div>`;
}

/* ---------- Rendu ---------- */
const VIEWS = {tableau:vTableau, equipes:vEquipes, paris:vParis, classement:vClassement, orga:vOrga, compte:vCompte};
let tab = (location.hash || "").slice(1);
if (!VIEWS[tab]) tab = "tableau";

function snapshot(){
  const o = {};
  view.querySelectorAll("input[id],select[id]").forEach(el => { o[el.id] = el.value; });
  const a = document.activeElement;
  return {o, focus:(a && a.id && view.contains(a)) ? a.id : null};
}
function restore(s){
  for (const [id, v] of Object.entries(s.o)){
    const el = $(id); if (!el || id.startsWith("oa-") || id.startsWith("ob-")) continue;
    if (el.tagName === "SELECT"){ if ([...el.options].some(op => op.value === v)) el.value = v; }
    else el.value = v;
  }
  if (s.focus){ const el = $(s.focus); if (el){ el.focus(); try { const L = el.value.length; el.setSelectionRange(L, L); } catch(e){} } }
}

function syncBetForm(want){
  const ms = $("bet-match"), ts = $("bet-team");
  if (!ms || !ts) return;
  const m = matchById(ms.value);
  const prev = want || ts.value;
  ts.innerHTML = m ? [[m.team_a, m.odds_a], [m.team_b, m.odds_b]].map(([id, o]) => `<option value="${id}">${esc(tName(id))} · ${fOdds(o)}</option>`).join("") : "";
  if ([...ts.options].some(o => o.value === prev)) ts.value = prev;
  updateGain();
}
function updateGain(){
  const g = $("bet-gain"), m = matchById(($("bet-match") || {}).value), t = ($("bet-team") || {}).value;
  if (!g) return;
  const amt = Math.round(Number(($("bf-amount") || {}).value));
  if (!m || !t || !(amt > 0)){ g.innerHTML = "Gain possible : <b>—</b>"; return; }
  const o = t === m.team_a ? m.odds_a : m.odds_b;
  g.innerHTML = `Gain possible : <b>${fmt(amt * o)} ryos</b> (mise de ${fmt(amt)}, cote ${fOdds(o)})`;
}

/* Onglets publics identiques pour tous ; tout ce qui est réservé est dans l'onglet Gérance.
   Hors Korin (aucune édition ouverte), le public n'a que le Classement et son compte. */
const ORGA_ONLY = ["orga"];
const KORIN_ONLY = ["tableau", "equipes", "paris"];
const canSee = t => {
  if (ORGA_ONLY.includes(t)) return !(backend.mode === "live" && !backend.isAdmin);
  if (KORIN_ONLY.includes(t)) return korinOpen();
  return true;
};
const homeTab = () => korinOpen() ? "tableau" : "classement";

function render(resetForm){
  if (!canSee(tab)){ tab = homeTab(); try { history.replaceState(null, "", "#" + tab); } catch(e){} resetForm = true; }
  const s = snapshot();
  view.innerHTML = VIEWS[tab]();
  if (!resetForm) restore(s);
  syncBetForm(resetForm ? null : s.o["bet-team"]);
  const live = backend.mode === "live";
  [...ORGA_ONLY, ...KORIN_ONLY].forEach(t => document.querySelectorAll(`.tab[data-tab="${t}"]`).forEach(b => { b.hidden = !canSee(t); }));
  document.querySelector(".brand").dataset.tab = homeTab();
  $("tab-compte").textContent = !live ? "Compte" : backend.user ? (S.me ? fmtSigned(S.me.balance) + " 両 · " + S.me.username : "Mon compte") : "Connexion";
  document.querySelectorAll(".tab").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
}

function go(t){
  if (!VIEWS[t]) return;
  tab = t;
  try { history.replaceState(null, "", "#" + t); } catch(e){}
  view.innerHTML = "";
  render(true);
  window.scrollTo({top:0});
}

let toastT = null;
function toast(msg, err){
  const el = $("toast");
  el.textContent = msg; el.classList.toggle("err", !!err); el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, err ? 5200 : 3000);
}

async function run(fn, okMsg, resetForm){
  try { await fn(); render(!!resetForm); if (okMsg) toast(okMsg); }
  catch(e){ toast(e.message || "Une erreur est survenue.", true); try { await reload(); } catch(_){} render(false); }
}

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const ACTIONS = {
  "del-team": b => run(() => deleteTeam(b.dataset.id), "Équipe retirée."),
  "draw": () => run(() => drawBracket(shuffle(S.teams.map(t => t.id))), "Tableau tiré au sort."),
  "odds": b => run(() => setOdds(b.dataset.id, $("oa-" + b.dataset.id).value, $("ob-" + b.dataset.id).value), "Cotes enregistrées."),
  "status": b => run(() => setStatus(b.dataset.id, b.dataset.st), b.dataset.st === "ouvert" ? "Paris rouverts." : "Paris fermés."),
  "win": b => run(() => declareWinner(b.dataset.id, b.dataset.team), "Vainqueur déclaré, paris réglés."),
  "undo": b => run(() => undoResult(b.dataset.id), "Résultat annulé."),
  "del-bet": b => run(() => deleteBet(b.dataset.id), backend.mode === "live" ? "Pari annulé, mise rendue." : "Pari retiré."),
  "adj": b => run(() => adjustBalance(b.dataset.id, ($("adj-" + b.dataset.id) || {}).value, Number(b.dataset.sign)),
    b.dataset.sign === "1" ? "Ryos crédités." : "Ryos retirés.", true),
  "reset": () => run(resetAll, "Tournoi réinitialisé."),
  "reseed": () => run(async () => { await backend.wipe(); await reload(); }, "Données d'exemple rechargées."),
  "logout": () => run(async () => { await backend.logout(); accountList = null; await reload(); }, "Déconnecté."),
  "auth-mode": b => { authMode = b.dataset.mode; render(true); },
  "gtab": b => { gTab = b.dataset.g; if (tab !== "orga") go("orga"); else { render(true); window.scrollTo({top:0}); } },
  "load-accounts": () => run(async () => { accountList = await backend.accounts(); }),
  "hist-ed": b => { histEd = b.dataset.id; histQ = ""; if (tab !== "orga" || gTab !== "historique"){ gTab = "historique"; go("orga"); } else { render(true); window.scrollTo({top:0}); } },
  "ed-open": () => run(() => setEditionDate(Date.now()), "Korin ouvert au public."),
  "ed-close": () => run(closeEdition, "Korin clôturé et rangé dans l'historique."),
  "ed-del": b => run(() => deleteEdition(b.dataset.id), "Korin supprimé de l'historique."),
  "acct-sel": b => { selAcct = b.dataset.id; if (tab !== "orga" || gTab !== "comptes"){ gTab = "comptes"; go("orga"); } else { render(true); window.scrollTo({top:0}); } },
  "grade-me": () => run(async () => { await backend.setGrade(backend.user.id, $("grade-me").value); await reload(); }, "Grade enregistré."),
  "grade-set": b => run(async () => { await backend.setGrade(b.dataset.id, $("gr-" + b.dataset.id).value); await reload(); }, "Grade changé."),
  "acct-pw": b => run(async () => { await backend.setPassword(b.dataset.id, ($("pw-" + b.dataset.id) || {}).value); }, "Mot de passe changé. Donne-le au joueur.", true),
  "acct-del": b => run(async () => { await backend.deleteUser(b.dataset.id); selAcct = ""; await reload(); }, "Compte supprimé."),
  "orga": b => run(async () => { await backend.setOrga(b.dataset.id, b.dataset.on === "1"); accountList = await backend.accounts(); },
    b.dataset.on === "1" ? "Nommé gérant." : "Retiré de la gérance."),
  "bl-acct": b => run(() => addBlacklist(b.dataset.name, ""), "Ajouté à la blacklist."),
  "bl-del": b => run(async () => { await backend.remove("blacklist", b.dataset.id); await reload(); }, "Retiré de la blacklist.")
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if (t){ go(t.dataset.tab); return; }
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  if (b.dataset.confirm && !b.dataset.armed){
    b.dataset.armed = "1"; b.dataset.label = b.textContent; b.textContent = b.dataset.confirm; b.classList.add("armed");
    setTimeout(() => { if (b.isConnected && b.dataset.armed){ delete b.dataset.armed; b.textContent = b.dataset.label; b.classList.remove("armed"); } }, 4000);
    return;
  }
  const fn = ACTIONS[b.dataset.act];
  if (fn){ b.disabled = true; fn(b); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]");
  if (!f) return;
  e.preventDefault();
  const k = f.dataset.form;
  if (k === "team") run(() => addTeam({name:$("tf-name").value, p1:$("tf-p1").value, p2:$("tf-p2").value}), "Équipe inscrite.", true);
  if (k === "bet") run(() => addBet({bettor:($("bf-who") || {}).value, userId:($("bf-user") || {}).value, matchId:$("bet-match").value, teamId:$("bet-team").value, amount:$("bf-amount").value}), "Pari enregistré.", true);
  if (k === "ed-create") run(() => createEdition($("ed-name").value, $("ed-when").value), "Korin programmé.", true);
  if (k === "ed-date") run(async () => { await renameEdition($("ed-rename").value); await setEditionDate($("ed-when2").value); }, "Korin mis à jour.", true);
  if (k === "gerant") run(async () => { await backend.setOrga($("ger-user").value, true); await reload(); }, "Nommé gérant.", true);
  if (k === "blacklist") run(() => addBlacklist($("bl-name").value, $("bl-reason").value), "Ajouté à la blacklist.", true);
  if (k === "login") run(async () => { await backend.login($("lg-user").value, $("lg-pw").value); await reload(); }, "Connecté.", true);
  if (k === "signup") run(async () => { await backend.signup($("lg-user").value, $("lg-pw").value, $("lg-pw2").value, $("lg-grade").value); authMode = "login"; await reload(); }, "Compte créé. Bienvenue !", true);
});

document.addEventListener("change", e => { if (e.target.id === "bet-match") syncBetForm(); if (e.target.id === "bet-team") updateGain(); });
document.addEventListener("input", e => {
  if (e.target.id === "bf-amount") updateGain();
  if (e.target.id === "hist-q"){ histQ = e.target.value; render(false); }
  if (e.target.id === "acct-q"){ acctQ = e.target.value; render(false); }
});
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== tab) go(t); });

/* ---------- Démarrage ---------- */
async function init(){
  const wantsLive = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
  const notice = (html) => { $("notice-text").innerHTML = html; $("notice").hidden = false; };
  if (wantsLive && window.supabase){
    backend = supaBackend();
    try { await backend.checkAdmin(); } catch(e){}
    /* Rappel Supabase : ne pas appeler l'API directement dans ce callback, on diffère. */
    let lastUser = backend.user ? backend.user.id : null;
    backend.sb.auth.onAuthStateChange((ev, session) => {
      const u = session && session.user ? session.user.id : null;
      if (u === lastUser) return;
      lastUser = u;
      setTimeout(async () => { try { await backend.checkAdmin(); await reload(); } catch(e){} render(false); }, 0);
    });
    backend.subscribe(async () => { try { await reload(); render(false); } catch(e){} });
    /* Les joueurs ne reçoivent pas en direct les paris des autres (invisibles pour eux) : on rafraîchit les totaux toutes les 30 s. */
    setInterval(async () => { if (document.hidden) return; try { await reload(); render(false); } catch(e){} }, 30000);
  } else {
    backend = demoBackend();
    notice(wantsLive
      ? "<b>Connexion à la base impossible.</b> La librairie Supabase n'a pas pu se charger : le site affiche des données d'exemple."
      : "<b>Mode démo.</b> Données d'exemple, enregistrées seulement dans ce navigateur. Renseigne Supabase dans le fichier pour un vrai site partagé.");
  }
  try { await reload(); }
  catch(e){
    view.innerHTML = emptyBox("砂", "Impossible de charger le tournoi : " + esc(e.message) + "<br>Vérifie l'URL et la clé Supabase, et que le script SQL a bien été exécuté.");
    return;
  }
  render(true);
}
init();

/* ---------- Mise à jour automatique ----------
   GitHub Pages laisse les navigateurs garder la page en cache (10 min) : on compare APP_VERSION
   avec la version en ligne et on recharge. À CHANGER à chaque mise en ligne. */
const APP_VERSION = "2026-10-05.1";
let updateShown = false;
async function checkUpdate(){
  if (updateShown) return;
  try {
    const r = await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"});
    const m = (await r.text()).match(/const APP_VERSION = "([^"]+)"/);
    if (!m || m[1] === APP_VERSION) return;
    const a = document.activeElement, typing = a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.value;
    let tried = null; try { tried = sessionStorage.getItem("korin-maj"); } catch(e){}
    if (!typing && tried !== m[1]){   // une seule tentative par version, pour ne jamais boucler
      try { sessionStorage.setItem("korin-maj", m[1]); } catch(e){}
      ACTIONS.reload(); return;
    }
    updateShown = true;   // quelqu'un écrit, ou le rechargement n'a pas suffi : on propose un bouton
    $("notice-text").innerHTML = '<b>Nouvelle version du site.</b> <button class="btn sm" data-act="reload">Recharger</button>';
    $("notice").hidden = false;
  } catch(e){}
}
ACTIONS.reload = () => { location.href = location.pathname + "?v=" + Date.now() + location.hash; };
checkUpdate();
setInterval(checkUpdate, 120000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });

/* Exposé pour les tests uniquement */
window.__korin = {buildBracket};
})();
