<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korin de Suna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,500;1,400&family=Cinzel:wght@500;700&family=Kaushan+Script&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
/* Univers de l'affiche : fond noir → bordeaux, typo gravée dorée, sceau rouge sang, kanjis en filigrane.
   En-tête collant + vues à onglets, contenu dans une colonne de 1100px. Thème sombre unique, assumé. */
:root{
  --ink:#0c0606; --wine:#2b0b0c; --wine-2:#3a1012; --panel:#160909; --panel-2:#221011;
  --field:#0f0707;
  --gold:#d6b27c; --gold-dim:#9a7f57; --blood:#c3161f; --blood-dim:#6e1418; --blood-text:#ef8d88;
  --sand:#f1e8da; --muted:#ad9a8a; --line:rgba(214,178,124,.30); --line-soft:rgba(214,178,124,.13);
  --on-gold:#1b0b06;
  --f-brush:"Kaushan Script","Brush Script MT",cursive;
  --f-title:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-kanji:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;min-height:100%;color:var(--sand);font:400 16px/1.55 var(--f-body);
  background:radial-gradient(120% 55% at 50% -8%, var(--wine) 0%, var(--ink) 68%) no-repeat, var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:20px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,6,6,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;background:none;border:0;padding:0;cursor:pointer}
.mini-seal{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-dim);display:grid;place-items:center;background:#000;font:700 12px/1 var(--f-kanji);color:var(--blood);letter-spacing:-.05em}
.brand b{font:400 27px/1 var(--f-brush);color:var(--gold)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:23px 10px 21px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--sand)}
.tab[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold)}
.tab-orga{margin-left:auto}
.tab-orga[hidden]+.tab-compte{margin-left:auto}
.tab-compte{color:var(--gold)}
@media (max-width:760px){
  .top .wrap{flex-wrap:wrap;gap:0}
  .brand{padding-top:10px}
  .tabs{flex-basis:100%}
  .tab{padding:13px 10px 12px}
  .tab-orga,.tab-orga[hidden]+.tab-compte{margin-left:0}
}
.wallet{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px}
.wallet .v{font:700 clamp(2rem,5vw,2.8rem)/1 var(--f-title);color:var(--gold);font-variant-numeric:tabular-nums}
.wallet .v small{font:500 18px var(--f-kanji);color:var(--blood);margin-left:6px}
.adj{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.adj input{width:96px;padding:7px 8px}
.adj select{width:auto;min-width:180px;padding:7px 8px}
.notice{border-bottom:1px solid var(--line-soft);background:rgba(110,20,24,.28);color:var(--sand);font-size:13.5px}
.notice .wrap{padding-block:8px}
.notice b{color:var(--gold);font-weight:600}

main{padding-block:26px 72px}
.sec{margin-top:46px}
.sec:first-child{margin-top:0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:16px}
.pt{font:700 clamp(1.6rem,3.4vw,2.2rem)/1.15 var(--f-title);color:var(--gold);letter-spacing:.05em;margin:0;text-wrap:balance}
h2{font:700 clamp(1.15rem,2.4vw,1.45rem)/1.2 var(--f-title);color:var(--gold);letter-spacing:.06em;margin:0;text-wrap:balance}
.k{font-family:var(--f-kanji);color:var(--blood);font-weight:700;margin-right:.45em}
.sub{color:var(--muted);margin:6px 0 0;max-width:65ch}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dim)}

/* Accueil : affiche */
.hero{position:relative;overflow:hidden;border:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(58,16,18,.55),rgba(12,6,6,.15));padding:42px 20px 34px;text-align:center}
.wm{position:absolute;font:700 1em/1 var(--f-kanji);color:var(--blood);opacity:.11;pointer-events:none;user-select:none}
.wm-1{font-size:clamp(7rem,20vw,13rem);right:16%;top:40%}
.wm-2{font-size:clamp(7rem,20vw,13rem);right:-2%;top:30%;writing-mode:vertical-rl}
.banner{position:absolute;top:0;width:76px;padding:18px 0 34px;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:linear-gradient(180deg,var(--wine-2),#1c0707);border:1px solid rgba(214,178,124,.18);border-top:0;
  clip-path:polygon(0 0,100% 0,100% 90%,50% 100%,0 90%)}
.banner.l{left:28px}.banner.r{right:28px}
.banner .vk{writing-mode:vertical-rl;white-space:nowrap;font:500 34px/1.05 var(--f-kanji);color:var(--gold);letter-spacing:.06em}
.banner .bn{font:700 13px/1 var(--f-body);letter-spacing:.12em;color:var(--gold)}
.banner .lz{width:38px;height:38px;border:1px solid var(--gold-dim);transform:rotate(45deg);display:grid;place-items:center;margin-top:6px}
.banner .lz span{transform:rotate(-45deg);font:500 18px/1 var(--f-kanji);color:var(--gold)}
@media (max-width:820px){.banner{display:none}}
.hero-core{position:relative;max-width:640px;margin-inline:auto}
.seal{width:116px;height:116px;margin:0 auto;border-radius:50%;background:#000;border:1px solid var(--sand);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(0,0,0,.5)}
.seal div{width:84px;height:84px;border-radius:50% 50% 46% 46%;border:2px solid var(--blood);display:grid;place-items:center;font:700 25px/1 var(--f-kanji);color:var(--blood);letter-spacing:-.02em}
.wordmark{margin:12px 0 0;font:400 clamp(4.2rem,15vw,8.6rem)/1 var(--f-brush);color:var(--gold);letter-spacing:.01em}
@supports (-webkit-text-stroke:2px black){.wordmark{color:var(--ink);-webkit-text-stroke:2px var(--gold)}}
.rule{display:flex;align-items:center;gap:12px;max-width:560px;margin:10px auto 0;font:700 clamp(1.1rem,2.8vw,1.55rem)/1.2 var(--f-body);color:var(--sand)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.rule::after{background:linear-gradient(270deg,transparent,var(--gold-dim))}
.dia{color:var(--gold);font-size:.8em}
.triad{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 22px;margin:22px 0 0;font:700 15px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.motto{margin:30px 0 0;font:italic 400 clamp(1.4rem,3.4vw,1.8rem)/1.2 var(--f-cond);color:var(--sand)}
.frame{margin:22px auto 0;max-width:520px;border:1px solid rgba(241,232,218,.75);padding:16px 18px;display:grid;gap:14px;font:700 clamp(1.05rem,2.6vw,1.35rem)/1.25 var(--f-body);color:var(--gold)}
.frame p{margin:0}
.dice{display:flex;justify-content:center;align-items:center;gap:20px;margin:26px 0 0}
.die{width:40px;height:40px;border:1px solid var(--sand);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px}
.die i{width:7px;height:7px;border:1px solid var(--sand);border-radius:50%;place-self:center}
.tagline{margin:24px 0 0;font:700 12.5px/1.7 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.champ-banner{margin:26px auto 0;max-width:520px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:12px}
.champ-banner strong{display:block;font:400 clamp(1.7rem,5vw,2.4rem)/1.1 var(--f-brush);color:var(--gold);margin-top:6px}
@media (prefers-reduced-motion:no-preference){
  .hero-core>*{animation:rise .7s both}
  .hero-core>*:nth-child(2){animation-delay:.08s}.hero-core>*:nth-child(3){animation-delay:.16s}
  .hero-core>*:nth-child(n+4){animation-delay:.24s}
  @keyframes rise{from{opacity:.0001;transform:translateY(8px)}to{opacity:1;transform:none}}
}

/* Chiffres clés */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}
.stat{border-top:1px solid var(--gold-dim);padding-top:12px}
.stat .v{font:700 clamp(1.7rem,4vw,2.3rem)/1.1 var(--f-title);color:var(--gold);font-variant-numeric:tabular-nums}
.stat .v small{font:600 13px var(--f-body);color:var(--muted);margin-left:4px}
@media (max-width:560px){.stats{grid-template-columns:1fr;gap:14px}}

/* Combats (paris) */
.duels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.duel{background:var(--panel);border:1px solid var(--line-soft);display:flex;flex-direction:column}
.duel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.side{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 14px}
.side .nm{font:700 1.05rem/1.25 var(--f-title);color:var(--sand);overflow-wrap:anywhere}
.side .pl{grid-column:1;font-size:13.5px;color:var(--muted)}
.side .od{grid-row:1/3;grid-column:2;text-align:right}
.side .od b{display:block;font:700 1.4rem/1 var(--f-title);color:var(--gold);font-variant-numeric:tabular-nums}
.side .od span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.side.win .nm{color:var(--gold)}
.side.win .nm::before{content:"◆ ";color:var(--gold);font-size:.8em}
.side.lose{opacity:.55}
.side.lose .nm{text-decoration:line-through;text-decoration-color:var(--blood)}
.vs{display:flex;align-items:center;gap:10px;padding-inline:14px;font:700 11px/1 var(--f-body);letter-spacing:.2em;color:var(--blood)}
.vs::before,.vs::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.duel-foot{margin-top:auto;padding:10px 14px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-open{color:var(--gold);border-color:var(--gold)}
.p-closed{color:var(--blood-text);border-color:var(--blood-dim)}
.p-done{color:var(--muted);border-color:var(--line)}
.p-wait{color:var(--muted);border-color:var(--line-soft);border-style:dashed}
.p-in{color:var(--gold);border-color:var(--line)}
.p-champ{color:var(--on-gold);background:var(--gold);border-color:var(--gold)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
th{text-align:left;font:600 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
.pos{color:var(--gold)}.neg{color:var(--blood-text)}.mut{color:var(--muted)}
.rank{font:700 18px/1 var(--f-kanji);color:var(--gold);width:44px;text-align:center}
.rank.n{font:600 14px var(--f-body);color:var(--muted)}
.who{font-weight:600}

/* Tableau du tournoi */
.bracket-scroll{overflow-x:auto;padding-bottom:10px}
.bracket{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:30px;min-width:max-content}
.round{display:flex;flex-direction:column;gap:12px}
.round h3{margin:0;font:600 11px/1.2 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dim);padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
.round-list{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.bm{position:relative;background:var(--panel);border:1px solid var(--line)}
.round:not(:last-child) .bm::after{content:"";position:absolute;left:100%;top:50%;width:30px;height:1px;background:var(--line)}
.bt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;font-size:14.5px}
.bt+.bt{border-top:1px solid var(--line-soft)}
.bt .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bt .o{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.bt.w .n{color:var(--gold)}
.bt.w .n::before{content:"◆ ";font-size:.8em}
.bt.l .n{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--blood)}
.bt.tbd .n{color:var(--muted);font-weight:400;font-style:italic}
.bm-st{padding:5px 11px;border-top:1px solid var(--line-soft);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim)}
.bm.open{border-color:var(--gold)}
.crown{border:1px solid var(--gold);background:linear-gradient(180deg,rgba(214,178,124,.12),transparent);padding:18px 14px;text-align:center}
.crown .kj{font:700 34px/1 var(--f-kanji);color:var(--blood)}
.crown strong{display:block;font:400 1.7rem/1.15 var(--f-brush);color:var(--gold);margin-top:8px;overflow-wrap:anywhere}
.crown span{font-size:13px;color:var(--muted)}

/* Équipes */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
.team{background:var(--panel);border:1px solid var(--line-soft);padding:14px 16px;display:grid;gap:8px;align-content:start}
.team .nm{font:700 1.05rem/1.25 var(--f-title);color:var(--gold);overflow-wrap:anywhere}
.team .pl{font-size:14px;color:var(--sand)}
.team .pl em{font-style:normal;color:var(--blood);font-family:var(--f-kanji);margin-inline:6px}
.team.out{opacity:.6}
.team.out .nm{color:var(--muted)}
.team-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Formulaires et boutons */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:14px;align-items:end;padding:18px;border:1px solid var(--line);background:var(--panel)}
.form .full{grid-column:1/-1}
label.f{display:grid;gap:6px;min-width:0}
input,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:2px;padding:10px 11px;color:var(--sand);min-width:0}
input:focus,select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 2px rgba(214,178,124,.25)}
.gain{font-size:14px;color:var(--muted)}
.gain b{color:var(--gold);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:12px 16px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);border-radius:2px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(214,178,124,.1)}
.btn.danger{background:transparent;border-color:var(--blood);color:var(--blood-text)}
.btn.armed{background:var(--blood);border-color:var(--blood);color:var(--sand)}
.btn.sm{padding:8px 10px;font-size:10.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:13.5px;color:var(--muted);margin:10px 0 0;max-width:70ch}

/* Orga : gestion des combats */
.mlist{display:grid;gap:12px}
.mrow{background:var(--panel);border:1px solid var(--line-soft);padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:center}
.mrow .t{font:700 1rem/1.3 var(--f-title);color:var(--sand);overflow-wrap:anywhere}
.mrow .t .dia{margin-inline:6px}
.mrow .meta{font-size:13px;color:var(--muted);margin-top:4px}
.mrow .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.odds-in{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.odds-in input{width:76px;padding:7px 8px}
@media (max-width:700px){.mrow{grid-template-columns:1fr}.mrow .ctl{justify-content:flex-start}}
.panel{border:1px solid var(--line);background:var(--panel);padding:18px}
.panel p{margin:0 0 12px}
.panel p:last-child{margin-bottom:0}
.danger-zone{border-color:var(--blood-dim)}

.empty{border:1px dashed var(--line);padding:30px 20px;text-align:center;color:var(--muted)}
.empty .kj{display:block;font:700 46px/1 var(--f-kanji);color:var(--blood);opacity:.5;margin-bottom:10px}
.filter{max-width:320px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);background:var(--panel-2);border:1px solid var(--gold);color:var(--sand);padding:11px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.toast.err{border-color:var(--blood)}
footer{border-top:1px solid var(--line-soft);color:var(--muted);font-size:13px}
footer .wrap{padding-block:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" data-tab="tableau" aria-label="Tableau du Korin"><span class="mini-seal">血契</span><b>Korin</b></button>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button class="tab" data-tab="tableau">Tableau</button>
      <button class="tab" data-tab="equipes">Équipes</button>
      <button class="tab" data-tab="paris">Paris</button>
      <button class="tab" data-tab="classement">Classement</button>
      <button class="tab tab-orga" data-tab="orga" id="tab-orga">Gérance</button>
      <button class="tab tab-compte" data-tab="compte" id="tab-compte">Connexion</button>
    </nav>
  </div>
</header>
<div class="notice" id="notice" hidden><div class="wrap" id="notice-text"></div></div>
<main class="wrap" id="view"><p class="mut">Chargement du tournoi…</p></main>
<footer><div class="wrap"><span>Korin de Suna · organisé par la famille Chiiketsu</span><span>砂隠れの里</span></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   CONFIGURATION
   Colle ici l'URL et la clé "anon public" de ton projet Supabase
   (Project Settings → API). Laisse vide pour le mode démo.
   Ne mets JAMAIS la clé "service_role" ici.
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: "https://jidpdwngoazxcdgpmwyc.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_qi7xIh_WcJ4TaRdla2ybVA_XYaKrbC7"
};

/* ---------- Outils ---------- */
const $ = id => document.getElementById(id);
const view = $("view");
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ Math.random() * 16 >> c / 4).toString(16));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(Number(n) || 0).toLocaleString("fr-FR");

const balCls = n => n > 0 ? "pos" : n < 0 ? "neg" : "mut";

/* Même règle que public.name_key() dans schema.sql (sert aussi pour la blacklist) */
const nameKey = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, "");
function cleanUsername(u){
  const name = String(u || "").trim().replace(/\s+/g, " ");
  if (name.length < 3 || name.length > 40 || !/^[\p{L}][\p{L}' .-]*[\p{L}]$/u.test(name))
    fail("Le nom doit faire 3 à 40 caractères : lettres (accents permis), espaces, apostrophe ou tiret. Ex. : Ryuta Chiiketsu.");
  const slug = nameKey(name);
  if (slug.length < 2) fail("Écris ton nom en lettres latines (ex. : Ryuta Chiiketsu).");
  return {name, slug};
}

/* ---------- Stockage : mode démo (ce navigateur) ---------- */
function demoBackend(){
  const KEY = "korin-demo-v2";
  let data = null;
  try { data = JSON.parse(localStorage.getItem(KEY)); } catch(e){ data = null; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} };
  return {
    mode:"demo", isAdmin:true, user:null,
    async load(){
      if (!data){ data = {teams:[], matches:[], bets:[], editions:[], blacklist:[]}; await seedDemo(); save(); }
      data.blacklist = data.blacklist || [];
      data.editions = data.editions || [];
      return clone(data);
    },
    async insert(table, rows){ data[table].push(...clone(rows)); save(); },
    async update(table, id, patch){ const r = data[table].find(x => x.id === id); if (r) Object.assign(r, clone(patch)); save(); },
    async remove(table, id){
      data[table] = data[table].filter(x => x.id !== id);
      if (table === "matches") data.bets = data.bets.filter(b => b.match_id !== id);
      if (table === "teams") data.bets = data.bets.filter(b => b.team_id !== id);
      save();
    },
    async clear(table, ed){
      data[table] = data[table].filter(x => x.edition_id !== ed);
      if (table === "matches") data.bets = data.bets.filter(x => x.edition_id !== ed);
      save();
    },
    async removeEdition(ed){
      for (const t of ["bets", "matches", "teams"]) data[t] = data[t].filter(x => x.edition_id !== ed);
      data.editions = data.editions.filter(x => x.id !== ed); save();
    },
    async wipe(){ data = null; try { localStorage.removeItem(KEY); } catch(e){} }
  };
}

/* ---------- Stockage : Supabase (site partagé) ---------- */
function supaBackend(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const chk = r => { if (r.error) fail(r.error.message); return r; };
  return {
    mode:"live", isAdmin:false, user:null, sb,
    /* Les paris détaillés ne reviennent que pour soi (ou tous pour la gérance) ;
       les totaux et le classement passent par des fonctions qui ne donnent que des sommes. */
    async load(){
      const [t, m, b, tot, lb, ed, res] = await Promise.all([
        sb.from("teams").select("*").order("created_at"),
        sb.from("matches").select("*").order("round").order("slot"),
        sb.from("bets").select("*").order("created_at", {ascending:false}),
        sb.rpc("bet_totals"),
        sb.rpc("leaderboard"),
        sb.from("editions").select("*").order("starts_at"),
        sb.rpc("korin_results")
      ]);
      [t, m, b].forEach(chk);
      const soft = r => r.error ? null : r.data;   // fonctions absentes si schema.sql n'est pas à jour : on retombe sur un calcul local
      const editions = soft(ed) || [];
      let me = null, ledger = [], blacklist = [];
      if (this.user){
        const [p, l] = await Promise.all([
          sb.from("profiles").select("username, balance, grade").eq("user_id", this.user.id).maybeSingle(),
          sb.from("ledger").select("*").eq("user_id", this.user.id).order("created_at", {ascending:false}).limit(100)
        ]);
        [p, l].forEach(chk);
        me = p.data ? {username:p.data.username, balance:Number(p.data.balance), grade:p.data.grade || "", banned:false} : null;
        if (me) me.banned = !!soft(await sb.rpc("is_blacklisted", {p_name:me.username}));
        ledger = l.data;
        if (this.isAdmin) blacklist = soft(await sb.from("blacklist").select("*").order("name")) || [];
      }
      const board = soft(lb) && lb.data.map(o => ({name:o.bettor, n:o.n, won:o.won, lost:o.lost, staked:o.staked, returned:o.returned, pending:o.pending}));
      return {teams:t.data, matches:m.data, bets:b.data, totals:soft(tot), board, me, ledger, blacklist, editions, results:soft(res)};
    },
    async nameBlacklisted(name){ const r = await sb.rpc("is_blacklisted", {p_name:name}); return !r.error && !!r.data; },
    async adjust(userId, delta){ chk(await sb.rpc("adjust_ryos", {p_user:userId, p_delta:delta, p_reason:null})); },
    async insert(table, rows){ chk(await sb.from(table).insert(rows)); },
    async update(table, id, patch){ chk(await sb.from(table).update(patch).eq("id", id)); },
    async remove(table, id){ chk(await sb.from(table).delete().eq("id", id)); },
    async clear(table, ed){ chk(await sb.from(table).delete().eq("edition_id", ed)); },
    async removeEdition(ed){ chk(await sb.from("editions").delete().eq("id", ed)); },
    async checkAdmin(){
      const {data} = await sb.auth.getUser();
      this.user = data && data.user ? data.user : null;
      if (!this.user){ this.isAdmin = false; this.username = ""; return; }
      this.username = (this.user.user_metadata && this.user.user_metadata.username) || String(this.user.email || "").split("@")[0];
      const r = await sb.from("admins").select("user_id").eq("user_id", this.user.id);
      this.isAdmin = !!(r.data && r.data.length);
    },
    async login(username, password){
      const u = cleanUsername(username);
      const {error} = await sb.auth.signInWithPassword({email:toEmail(u), password});
      if (error) fail("Connexion refusée : nom ou mot de passe incorrect.");
      await this.checkAdmin();
    },
    async signup(username, password, password2, grade){
      const u = cleanUsername(username);
      if (!GRADES.includes(grade)) fail("Choisis ton grade.");
      if ((password || "").length < 6) fail("Le mot de passe doit faire au moins 6 caractères.");
      if (password !== password2) fail("Les deux mots de passe ne sont pas identiques.");
      if (await this.nameBlacklisted(u.name)) fail("Inscription impossible : ce nom est sur la blacklist du Korin.");
      const {data, error} = await sb.auth.signUp({email:toEmail(u), password, options:{data:{username:u.name, grade}}});
      if (error){
        if (/already|registered|exists/i.test(error.message)) fail("Ce nom est déjà pris.");
        if (/database error/i.test(error.message)) fail("Inscription refusée : ce nom est sur la blacklist du Korin, ou il est invalide.");
        fail("Inscription refusée : " + error.message);
      }
      if (!data.session) fail("Compte créé, mais Supabase demande encore une confirmation par e-mail. Désactive « Confirm email » dans Authentication → Sign In / Providers → Email.");
      await this.checkAdmin();
    },
    async accounts(){

        sb.from("profiles").select("user_id, username, created_at, balance, grade").order("username"),
        sb.from("admins").select("user_id")
      ]);
      [p, a].forEach(chk);

      return p.data.map(x => ({...x, balance:Number(x.balance), orga:orgas.has(x.user_id)}));
    },
    async setOrga(userId, on){

      if (on) chk(await sb.from("admins").insert([{user_id:userId}]));
      else chk(await sb.from("admins").delete().eq("user_id", userId));
    },

      chk(await sb.rpc("set_grade", {p_user:userId, p_grade:grade}));
    },
    async setPassword(userId, pw){

      chk(await sb.rpc("admin_set_password", {p_user:userId, p_password:pw}));
    },

    },
    async logout(){ await sb.auth.signOut(); this.user = null; this.isAdmin = false; this.username = ""; },
    subscribe(cb){
      let t = null;
      sb.channel("korin-live")
        .on("postgres_changes", {event:"*", schema:"public"}, () => { clearTimeout(t); t = setTimeout(cb, 250); })
        .subscribe();
    }
  };
}

async function reload(){
  S = await backend.load();
  S.me = S.me || null; S.ledger = S.ledger || []; S.blacklist = S.blacklist || [];
  if (backend.mode === "live" && backend.isAdmin){ try { accountList = await backend.accounts(); } catch(e){} }
  S.matches.forEach(m => { m.odds_a = Number(m.odds_a); m.odds_b = Number(m.odds_b); }); S.bets.forEach(b => { b.odds = Number(b.odds); b.amount = Number(b.amount); b.payout = Number(b.payout); });
  if (!S.totals) S.totals = computeTotals(S.bets);
  if (!S.board) S.board = computeBoard(S.bets);
  /* Éditions : S.teams / S.matches / S.bets ne contiennent que l'édition en cours ;
     S.allTeams / S.allMatches / S.allBets gardent tout (historique, réservé à la gérance). */
  S.editions = (S.editions || []).slice().sort((a, b) => String(a.starts_at).localeCompare(String(b.starts_at)));
  S.cur = S.editions.find(e => !e.ended_at) || null;
  S.allTeams = S.teams; S.allMatches = S.matches; S.allBets = S.bets;
  const cid = S.cur ? S.cur.id : "__aucune__";
  S.teams = S.allTeams.filter(x => x.edition_id === cid);
  S.matches = S.allMatches.filter(x => x.edition_id === cid);
  S.bets = S.allBets.filter(x => x.edition_id === cid);
  if (!S.results) S.results = computeResults();
  S.totals.forEach(x => { x.n = Number(x.n); x.total = Number(x.total); });
  S.board = S.board.map(o => ({...o, net:Number(o.returned) - Number(o.staked)}))
    .sort((a, b) => b.net - a.net || b.returned - a.returned || a.name.localeCompare(b.name, "fr"));
}

/* Mode démo : mêmes totaux que ceux calculés par la base en ligne */
function computeTotals(bets){
  const map = new Map();
  for (const b of bets){
    const k = b.match_id + "|" + b.team_id;
    if (!map.has(k)) map.set(k, {match_id:b.match_id, team_id:b.team_id, n:0, total:0});
    const o = map.get(k); o.n++; o.total += b.amount;
  }
  return [...map.values()];
}
/* Mode démo : mêmes lignes que public.korin_results() (une par équipe et par Korin ouvert ou terminé) */
function computeResults(){
  const out = [];
  for (const e of S.editions.filter(e => e.ended_at || Date.parse(e.starts_at) <= Date.now())){
    const ms = S.allMatches.filter(m => m.edition_id === e.id);
    const R = ms.reduce((a, m) => Math.max(a, m.round), 0);
    const fin = ms.find(m => m.round === R && m.slot === 0);
    for (const t of S.allTeams.filter(x => x.edition_id === e.id)){
      const mine = ms.filter(m => m.team_a === t.id || m.team_b === t.id);
      out.push({edition_id:e.id, edition_name:e.name, starts_at:e.starts_at, ended_at:e.ended_at, team:t.name, player1:t.player1, player2:t.player2,
        wins:ms.filter(m => m.winner === t.id && !m.bye).length,
        losses:mine.filter(m => m.status === "termine" && m.winner && m.winner !== t.id).length,
        reached:mine.reduce((a, m) => Math.max(a, m.round), 0), rounds:R,
        champion:!!(fin && fin.winner === t.id), finalist:!!(fin && (fin.team_a === t.id || fin.team_b === t.id))});
    }
  }
  return out;
}

/* Classement des combattants, tous Korin confondus : 1 point par combat gagné (exemptions exclues).
   Le même nom (sans accents ni majuscules) cumule ses points d'un Korin à l'autre. Égalité de points = même rang. */
function fighterRanking(){
  const map = new Map();
  for (const r of S.results){
    for (const name of [r.player1, r.player2]){
      const k = nameKey(name); if (!k) continue;
      if (!map.has(k)) map.set(k, {key:k, name, points:0, losses:0, korins:0, titles:0, last:""});
      const o = map.get(k);
      o.points += r.wins; o.losses += r.losses; o.korins++;
      if (r.champion) o.titles++;
      if (String(r.starts_at) > o.last){ o.last = String(r.starts_at); o.name = name; }
    }
  }
  const list = [...map.values()].sort((a, b) => b.points - a.points || a.losses - b.losses || a.name.localeCompare(b.name, "fr"));
  list.forEach((o, i) => { o.rank = i && list[i - 1].points === o.points ? list[i - 1].rank : i + 1; });
  return list;
}
/* La ligne du joueur connecté dans ce classement (son nom de compte = son nom de combattant) */
const myFighter = (list = fighterRanking()) => S.me ? list.find(o => o.key === nameKey(S.me.username)) || null : null;

function computeBoard(bets){
  const map = new Map();
  for (const b of bets){
    const k = b.bettor.trim().toLowerCase();
    if (!map.has(k)) map.set(k, {name:b.bettor.trim(), n:0, won:0, lost:0, staked:0, returned:0, pending:0});
    const o = map.get(k);
    o.n++;
    if (b.status === "en_cours") o.pending += b.amount;
    else { o.staked += b.amount; o.returned += b.payout; if (b.status === "gagne") o.won++; else o.lost++; }
  }
  return [...map.values()];
}
function stake(matchId, teamId){
  return S.totals.filter(x => x.match_id === matchId && (!teamId || x.team_id === teamId))
    .reduce((s, x) => ({n:s.n + x.n, total:s.total + x.total}), {n:0, total:0});
}
const isBlacklisted = name => !!nameKey(name) && S.blacklist.some(x => nameKey(x.name) === nameKey(name));

/* Le Korin est ouvert au public : une édition en cours dont la date d'ouverture est passée */
const korinOpen = () => !!(S.cur && Date.parse(S.cur.starts_at) <= Date.now());
const fDate = s => new Date(s).toLocaleString("fr-FR", {weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"});
const fDay = s => s ? new Date(s).toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit", year:"numeric"}) : "—";
function untilText(s){
  const ms = Date.parse(s) - Date.now();
  if (ms <= 0) return "maintenant";
  const m = Math.round(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d >= 1 ? `dans ${plural(d, "jour")}${h % 24 ? " et " + plural(h % 24, "heure") : ""}` : h >= 1 ? `dans ${plural(h, "heure")}${m % 60 ? " " + (m % 60) + " min" : ""}` : `dans ${plural(Math.max(1, m), "minute")}`;
}
/* Exécute fn comme si l'édition ed était l'édition en cours (pour réutiliser les vues dans l'historique) */
function withEdition(ed, fn){
  const keep = {teams:S.teams, matches:S.matches, bets:S.bets};
  S.teams = S.allTeams.filter(x => x.edition_id === ed);
  S.matches = S.allMatches.filter(x => x.edition_id === ed);
  S.bets = S.allBets.filter(x => x.edition_id === ed);
  try { return fn(); } finally { Object.assign(S, keep); }
}
function needKorin(){ if (!S.cur) fail("Aucun Korin en cours : lance-en un dans Gérance → Aperçu."); return S.cur.id; }

/* ---------- Lecture des données ---------- */
const teamById = id => S.teams.find(t => t.id === id);
const tName = id => { const t = teamById(id); return t ? t.name : "À déterminer"; };
const matchById = id => S.matches.find(m => m.id === id);
const totalRounds = () => S.matches.reduce((a, m) => Math.max(a, m.round), 0);
function roundName(r){
  const d = totalRounds() - r;
  return ["Finale", "Demi-finales", "Quarts de finale", "Huitièmes de finale", "Seizièmes de finale"][d] || ("Tour " + r);
}
const vsLabel = m => tName(m.team_a) + " vs " + tName(m.team_b);
const finalMatch = () => S.matches.find(m => m.round === totalRounds() && m.slot === 0);
function champion(){ const f = finalMatch(); return f && f.winner ? teamById(f.winner) : null; }

function teamStatus(id){
  if (!S.matches.length) return {key:"inscrite", label:"Inscrite", rank:0};
  const lost = S.matches.find(m => m.status === "termine" && m.winner && m.winner !== id && (m.team_a === id || m.team_b === id));
  if (lost) return {key:"out", label:"Éliminée · " + roundName(lost.round), rank:lost.round};
  const c = champion();
  if (c && c.id === id) return {key:"champ", label:"Championne", rank:totalRounds() + 2};
  const reached = Math.max(0, ...S.matches.filter(m => m.team_a === id || m.team_b === id).map(m => m.round));
  return {key:"in", label:"En course", rank:reached + 0.5};
}

async function addTeam({name, p1, p2}){
  name = (name || "").trim(); p1 = (p1 || "").trim(); p2 = (p2 || "").trim();
  if (!name || !p1 || !p2) fail("Remplis le nom de l'équipe et les deux combattants.");
  for (const p of [p1, p2]) if (isBlacklisted(p)) fail(p + " est sur la blacklist du Korin.");

}

/* Élimination directe. Les exemptions (s'il manque des équipes pour une puissance de 2) sont réparties dans tout le tableau. */
function buildBracket(order){
  const n = order.length;
  if (n < 2) fail("Il faut au moins 2 équipes pour tirer le tableau.");
  let size = 1; while (size < n) size *= 2;
  const R = Math.log2(size), M = size / 2, byes = size - n;
  const rows = [];
  for (let r = 1; r <= R; r++){
    for (let s = 0; s < size / Math.pow(2, r); s++){
      rows.push({id:uid(), edition_id:S.cur ? S.cur.id : null, round:r, slot:s, team_a:null, team_b:null, odds_a:2, odds_b:2, winner:null, status:"a_venir", bye:false, decided_at:null});
    }
  }
  const at = (r, s) => rows.find(x => x.round === r && x.slot === s);
  let i = 0;
  for (let j = 0; j < M; j++){
    const m = at(1, j);
    const isBye = Math.floor((j + 1) * byes / M) > Math.floor(j * byes / M);
    m.team_a = order[i++];
    if (isBye){ m.winner = m.team_a; m.status = "termine"; m.bye = true; m.decided_at = now(); }
    else m.team_b = order[i++];
  }
  if (R > 1){
    for (const m of rows.filter(x => x.round === 1 && x.bye)){
      const nx = at(2, Math.floor(m.slot / 2));
      if (m.slot % 2 === 0) nx.team_a = m.winner; else nx.team_b = m.winner;
    }
  }
  rows.forEach(m => { if (m.status !== "termine" && m.team_a && m.team_b) m.status = "ouvert"; });
  return rows;
}

async function drawBracket(order){
  const rows = buildBracket(order);
  const ed = needKorin();
  await backend.clear("bets", ed);
  await backend.clear("matches", ed);
  await backend.insert("matches", rows);
  await reload();
}

async function setOdds(id, a, b){
  a = Number(String(a).replace(",", ".")); b = Number(String(b).replace(",", "."));
  if (!(a >= 1.01 && b >= 1.01)) fail("Une cote doit être un nombre d'au moins 1,01.");
  if (a > 100 || b > 100) fail("Une cote ne peut pas dépasser 100.");
  const m = matchById(id); if (!m) fail("Combat introuvable.");
  if (m.status === "termine") fail("Ce combat est terminé, sa cote ne change plus.");
  await backend.update("matches", id, {odds_a:Math.round(a * 100) / 100, odds_b:Math.round(b * 100) / 100});
  await reload();
}

async function setStatus(id, st){
  const m = matchById(id); if (!m) fail("Combat introuvable.");
  if (!m.team_a || !m.team_b) fail("Les deux équipes de ce combat ne sont pas encore connues.");
  if (m.status === "termine") fail("Ce combat est déjà terminé.");
  await backend.update("matches", id, {status:st});
  await reload();
}

async function declareWinner(id, teamId){
  const m = matchById(id); if (!m) fail("Combat introuvable.");
  if (!m.team_a || !m.team_b) fail("Les deux équipes de ce combat ne sont pas encore connues.");
  if (m.status === "termine") fail("Le vainqueur de ce combat est déjà déclaré.");
  if (teamId !== m.team_a && teamId !== m.team_b) fail("Cette équipe ne participe pas à ce combat.");
  await backend.update("matches", id, {winner:teamId, status:"termine", decided_at:now()});
  for (const b of S.bets.filter(x => x.match_id === id && x.status === "en_cours")){
    const won = b.team_id === teamId;
    await backend.update("bets", b.id, won ? {status:"gagne", payout:Math.round(b.amount * b.odds)} : {status:"perdu", payout:0});
  }
  const nx = S.matches.find(x => x.round === m.round + 1 && x.slot === Math.floor(m.slot / 2));
  if (nx){
    const isA = m.slot % 2 === 0;
    const other = isA ? nx.team_b : nx.team_a;
    const patch = isA ? {team_a:teamId} : {team_b:teamId};
    if (other) patch.status = "ouvert";
    await backend.update("matches", nx.id, patch);
  }
  await reload();
}

async function undoResult(id){
  const m = matchById(id); if (!m) fail("Combat introuvable.");
  if (m.status !== "termine" || m.bye) fail("Ce combat n'a pas de résultat à annuler.");
  const nx = S.matches.find(x => x.round === m.round + 1 && x.slot === Math.floor(m.slot / 2));
  if (nx){
    if (nx.winner || S.bets.some(b => b.match_id === nx.id)) fail("Impossible : le combat suivant a déjà des paris ou un résultat.");
    await backend.update("matches", nx.id, m.slot % 2 === 0 ? {team_a:null, status:"a_venir"} : {team_b:null, status:"a_venir"});
  }
  for (const b of S.bets.filter(x => x.match_id === id)) await backend.update("bets", b.id, {status:"en_cours", payout:0});
  await backend.update("matches", id, {winner:null, status:"ferme", decided_at:null});
  await reload();
}

/* En ligne, chaque pari est lié à un compte : la base prélève la mise et versera le gain.
   En mode démo, l'orga saisit simplement un nom. */
async function addBet({bettor, userId, matchId, teamId, amount}){
  amount = Math.round(Number(amount));
  const m = matchById(matchId);
  if (!m) fail("Choisis un combat.");
  if (m.status !== "ouvert") fail("Les paris sont fermés pour ce combat.");
  if (teamId !== m.team_a && teamId !== m.team_b) fail("Choisis l'équipe sur laquelle parier.");
  if (!(amount > 0)) fail("La mise doit être d'au moins 1 ryo.");
  if (backend.mode === "live"){
    if (!backend.user) fail("Connecte-toi pour parier.");
    if (!userId || !isAdmin()) userId = backend.user.id;
    const acct = userId === backend.user.id ? S.me : (accountList || []).find(a => a.user_id === userId);
    if (!acct) fail("Compte introuvable.");
    bettor = acct.username;
  } else {
    bettor = (bettor || "").trim();
    if (!bettor) fail("Indique le nom du parieur.");
    userId = null;
  }
  if ((S.me && userId === (backend.user || {}).id && S.me.banned) || isBlacklisted(bettor))
    fail(bettor + " est sur la blacklist du Korin : paris interdits.");
  const odds = teamId === m.team_a ? m.odds_a : m.odds_b;
  const row = {id:uid(), edition_id:m.edition_id, bettor, match_id:matchId, team_id:teamId, amount, odds, status:"en_cours", payout:0, created_at:now()};
  if (userId) row.user_id = userId;
  await backend.insert("bets", [row]);
  await reload();
}

const isMine = b => !!(backend && backend.user && b.user_id === backend.user.id);
/* Un pari placé est définitif pour le joueur ; seule la gérance peut l'annuler (mise rendue) */
const canCancel = b => b.status === "en_cours" && isAdmin();

async function deleteBet(id){
  const b = S.bets.find(x => x.id === id); if (!b) fail("Pari introuvable.");
  if (b.status !== "en_cours") fail("Un pari déjà réglé ne peut plus être retiré.");
  if (!canCancel(b)) fail("Un pari placé ne peut plus être retiré.");
  await backend.remove("bets", id);
  await reload();
}

async function addBlacklist(name, reason){
  name = String(name || "").trim().replace(/\s+/g, " ");
  reason = String(reason || "").trim();
  if (nameKey(name).length < 2) fail("Indique le prénom et le nom à blacklister.");
  if (isBlacklisted(name)) fail(name + " est déjà sur la blacklist.");
  const acct = (accountList || []).find(a => nameKey(a.username) === nameKey(name));
  if (acct && acct.orga) fail("Retire d'abord cette personne de la gérance.");
  await backend.insert("blacklist", [{id:uid(), name, reason:reason || null, created_at:now()}]);
  await reload();
}

async function adjustBalance(userId, value, sign){
  const n = Math.round(Number(String(value || "").replace(/\s/g, "")));
  if (!(n > 0)) fail("Indique un nombre de ryos positif.");
  await backend.adjust(userId, sign * n);
  await reload();
}

async function resetAll(){
  const ed = needKorin();
  await backend.clear("bets", ed); await backend.clear("matches", ed); await backend.clear("teams", ed);
  await reload();
}

/* ---------- Éditions du Korin ---------- */
const toTime = v => typeof v === "number" ? v : Date.parse(v);
async function createEdition(name, when){
  if (S.cur) fail("Un Korin est déjà en cours : clôture-le d'abord.");
  name = String(name || "").trim();
  if (!name) fail("Donne un nom au Korin.");
  const t = toTime(when);
  if (isNaN(t)) fail("Choisis la date et l'heure d'ouverture.");
  await backend.insert("editions", [{id:uid(), name, starts_at:new Date(t).toISOString(), ended_at:null, created_at:now()}]);
  await reload();
}
async function setEditionDate(when){
  const ed = needKorin(), t = toTime(when);
  if (isNaN(t)) fail("Choisis la date et l'heure d'ouverture.");
  await backend.update("editions", ed, {starts_at:new Date(t).toISOString()});
  await reload();
}
async function renameEdition(name){
  name = String(name || "").trim(); if (!name) fail("Donne un nom au Korin.");
  await backend.update("editions", needKorin(), {name});
  await reload();
}
/* Clôture : les paris encore en cours sont annulés (mises rendues), puis l'édition part dans l'historique */
async function closeEdition(){
  const ed = needKorin();
  for (const b of S.bets.filter(x => x.status === "en_cours")) await backend.remove("bets", b.id);
  await backend.update("editions", ed, {ended_at:now()});
  histEd = ed;
  await reload();
}
async function deleteEdition(id){
  const e = S.editions.find(x => x.id === id); if (!e) fail("Korin introuvable.");
  if (!e.ended_at) fail("Clôture d'abord ce Korin.");
  await backend.removeEdition(id);
  histEd = "";
  await reload();
}

/* ---------- Morceaux d'interface ---------- */
function pill(m){
  if (m.bye) return '<span class="pill p-done">Exemptée</span>';
  return {
    ouvert:'<span class="pill p-open">Paris ouverts</span>',
    ferme:'<span class="pill p-closed">Paris fermés</span>',
    termine:'<span class="pill p-done">Terminé</span>',
    a_venir:'<span class="pill p-wait">En attente</span>'
  }[m.status] || "";
}

function side(m, k){
  const id = k === "a" ? m.team_a : m.team_b, t = teamById(id);
  const o = k === "a" ? m.odds_a : m.odds_b;
  const staked = id ? stake(m.id, id).total : 0;
  const cls = m.winner ? (m.winner === id ? "win" : "lose") : "";
  return `<div class="side ${cls}">
    <div class="nm">${esc(t ? t.name : "À déterminer")}</div>
    <div class="pl">${t ? esc(t.player1) + " & " + esc(t.player2) : "&nbsp;"}</div>
    <div class="od"><b>${fOdds(o)}</b><span>${fmt(staked)} ryos misés</span></div>
  </div>`;
}

function duel(m){
  const st = stake(m.id), total = st.total, bs = {length:st.n};
  return `<article class="duel">
    <div class="duel-head"><span class="eyebrow">${esc(roundName(m.round))}</span>${pill(m)}</div>
    ${side(m, "a")}<div class="vs">VS</div>${side(m, "b")}
    <div class="duel-foot">${plural(bs.length, "pari")} · ${fmt(total)} ryos en jeu</div>
  </article>`;
}

const die = n => {
  const pos = {1:[5], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9]}[n];
  return `<span class="die" aria-hidden="true">${[1,2,3,4,5,6,7,8,9].map(p => pos.includes(p) ? `<i style="grid-area:${Math.ceil(p/3)}/${(p-1)%3+1}"></i>` : "").join("")}</span>`;
};

const isAdmin = () => backend && backend.isAdmin;

/* Le tableau lui-même (réutilisé dans l'historique de la gérance) */
function bracketHtml(){
  const R = totalRounds(), c = champion();
  let cols = "";
  for (let r = 1; r <= R; r++){
    const ms = S.matches.filter(m => m.round === r).sort((a, b) => a.slot - b.slot);
    cols += `<div class="round"><h3>${esc(roundName(r))}</h3><div class="round-list">${ms.map(bm).join("")}</div></div>`;
  }
  cols += `<div class="round"><h3>Vainqueur</h3><div class="round-list"><div class="crown">
    <div class="kj">頂</div>${c ? `<strong>${esc(c.name)}</strong><span>${esc(c.player1)} & ${esc(c.player2)}</span>` : `<strong>?</strong><span>Le sable n'a pas encore tranché</span>`}
  </div></div></div>`;
  return `<div class="bracket-scroll"><div class="bracket">${cols}</div></div>`;
}

function bm(m){
  const line = k => {
    const id = k === "a" ? m.team_a : m.team_b, o = k === "a" ? m.odds_a : m.odds_b;
    if (!id) return `<div class="bt tbd"><span class="n">${m.bye && k === "b" ? "Exempt" : "À déterminer"}</span></div>`;
    const cls = m.winner ? (m.winner === id ? "w" : "l") : "";
    return `<div class="bt ${cls}"><span class="n" title="${esc(tName(id))}">${esc(tName(id))}</span>${!m.bye && m.team_a && m.team_b ? `<span class="o">${fOdds(o)}</span>` : ""}</div>`;
  };
  const st = m.bye ? "Exemptée" : {ouvert:"Paris ouverts", ferme:"Paris fermés", termine:"Terminé", a_venir:"En attente"}[m.status];
  return `<div class="bm ${m.status === "ouvert" ? "open" : ""}">${line("a")}${line("b")}<div class="bm-st">${st}</div></div>`;
}

function teamLists(canDelete){

    const st = teamStatus(t.id);
    const chip = {inscrite:'<span class="pill p-wait">Inscrite</span>', in:'<span class="pill p-in">En course</span>',
      champ:'<span class="pill p-champ">Championne</span>', out:`<span class="pill p-done">${esc(st.label)}</span>`}[st.key];
    return `<div class="team ${st.key === "out" ? "out" : ""}">
      <div class="nm">${esc(t.name)}</div>
      <div class="pl">${esc(t.player1)}<em>×</em>${esc(t.player2)}</div>
      <div class="team-foot">${chip}${canDelete ? `<button class="btn danger sm" data-act="del-team" data-id="${t.id}" data-confirm="Retirer ?">Retirer</button>` : ""}</div>
    </div>`;
  };
  if (!S.teams.length) return `<section class="sec">${emptyBox("組", "Aucune équipe inscrite pour l'instant.")}</section>`;
  if (!drawn) return `<section class="sec"><div class="sec-head"><h2>Inscrites · ${S.teams.length}</h2></div><div class="teams">${S.teams.map(card).join("")}</div></section>`;
  const ins = S.teams.filter(t => teamStatus(t.id).key !== "out").sort((a, b) => teamStatus(b.id).rank - teamStatus(a.id).rank);
  const outs = S.teams.filter(t => teamStatus(t.id).key === "out").sort((a, b) => teamStatus(b.id).rank - teamStatus(a.id).rank);
  return `<section class="sec"><div class="sec-head"><h2>Encore en course · ${ins.length}</h2></div>

}

function betRows(list, withDelete){

/* Gérance → Paris : pour chaque combat du Korin en cours, qui a parié sur chaque équipe */
function whoBetOnWho(){
  const ms = S.matches.filter(m => !m.bye && m.team_a && m.team_b && S.bets.some(b => b.match_id === m.id))
    .sort((a, b) => a.round - b.round || a.slot - b.slot);
  const res = b => b.status === "gagne" ? `<span class="pos">+${fmt(b.payout - b.amount)}</span>` : b.status === "perdu" ? `<span class="neg">−${fmt(b.amount)}</span>` : "";
  const side = (m, id) => {
    const bs = S.bets.filter(b => b.match_id === m.id && b.team_id === id).sort((a, b) => b.amount - a.amount);
    const cls = m.winner ? (m.winner === id ? "win" : "lose") : "";
    return `<div class="side ${cls}" style="display:block">
      <div class="nm">${esc(tName(id))}</div>
      <div class="pl" style="margin-bottom:6px">${plural(bs.length, "parieur")} · ${fmt(bs.reduce((s, b) => s + b.amount, 0))} ryos</div>
      ${bs.length ? `<table style="font-size:13.5px"><tbody>${bs.map(b => `<tr><td class="who" style="padding:4px 0">${esc(b.bettor)}</td>
        <td class="num" style="padding:4px 0 4px 10px">${fmt(b.amount)} · ${fOdds(b.odds)}</td><td class="num" style="padding:4px 0 4px 10px">${res(b)}</td></tr>`).join("")}</tbody></table>`
        : '<span class="mut" style="font-size:13px">Personne</span>'}
    </div>`;
  };
  return `<section class="sec"><div class="sec-head"><div><h2><span class="k">賭</span>Qui a parié sur qui</h2>
      <p class="sub">Tous les paris du Korin en cours, combat par combat : mise et cote de chaque parieur.</p></div></div>
    ${ms.length ? `<div class="duels">${ms.map(m => `<article class="duel">
      <div class="duel-head"><span class="eyebrow">${esc(roundName(m.round))}</span>${pill(m)}</div>
      ${side(m, m.team_a)}<div class="vs">VS</div>${side(m, m.team_b)}
    </article>`).join("")}</div>` : emptyBox("賭", "Aucun pari sur ce Korin pour l'instant.")}</section>`;
}

/* Gérance → Historique : la liste de tous les Korin, ou le détail complet de l'un d'eux */
function editionStats(ed){
  const teams = S.allTeams.filter(x => x.edition_id === ed);
  const matches = S.allMatches.filter(x => x.edition_id === ed);
  const bets = S.allBets.filter(x => x.edition_id === ed);
  const settled = bets.filter(b => b.status !== "en_cours");
  const staked = settled.reduce((s, b) => s + b.amount, 0), paid = settled.reduce((s, b) => s + b.payout, 0);
  const R = matches.reduce((a, m) => Math.max(a, m.round), 0);
  const fin = matches.find(m => m.round === R && m.slot === 0);
  return {teams, matches, bets, staked, paid, house:staked - paid,
    played:matches.filter(m => m.status === "termine" && !m.bye).length,
    pending:bets.filter(b => b.status === "en_cours").reduce((s, b) => s + b.amount, 0),
    bettors:new Set(bets.map(b => nameKey(b.bettor))).size,
    champ:fin && fin.winner ? teams.find(t => t.id === fin.winner) : null};
}
function edPill(e){
  if (e.ended_at) return '<span class="pill p-done">Terminé</span>';
  return Date.parse(e.starts_at) > Date.now() ? '<span class="pill p-wait">Programmé</span>' : '<span class="pill p-open">En cours</span>';
}

  const e = S.editions.find(x => x.id === histEd);

    ${teamLists(false)}`)}
  ${e.ended_at ? `<section class="sec"><div class="panel danger-zone"><p>Supprimer ce Korin efface définitivement ses équipes, combats et paris de l'historique. Les bilans des joueurs ne changent pas.</p>
    <button class="btn danger" data-act="ed-del" data-id="${e.id}" data-confirm="Confirmer : supprimer ce Korin">Supprimer ce Korin de l'historique</button></div></section>` : ""}`;
}

function histCombats(){
  const q = histQ.trim().toLowerCase();
  const hit = s => !q || String(s).toLowerCase().includes(q);
  const done = S.matches.filter(m => m.status === "termine" && !m.bye)
    .filter(m => hit(tName(m.team_a)) || hit(tName(m.team_b)))
    .sort((a, b) => (b.decided_at || "").localeCompare(a.decided_at || ""));
  const settled = S.bets.filter(b => b.status !== "en_cours")
    .filter(b => { const m = matchById(b.match_id); return hit(b.bettor) || hit(tName(b.team_id)) || (m && hit(vsLabel(m))); })
    .sort((a, b) => { const ma = matchById(a.match_id), mb = matchById(b.match_id); return ((mb && mb.decided_at) || "").localeCompare((ma && ma.decided_at) || ""); });
  const dt = s => s ? new Date(s).toLocaleString("fr-FR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "";
  return `<div class="sec-head" style="margin-top:46px"><div><h2><span class="k">史</span>Combats et paris</h2>
      <p class="sub">Tous les combats joués et tous les paris réglés de ce Korin.</p></div>
      <label class="f filter"><span class="eyebrow">Filtrer par parieur ou équipe</span><input id="hist-q" type="search" placeholder="Ex. Kasumi" autocomplete="off"></label></div>
    <section class="sec"><div class="sec-head"><h2>Combats joués · ${done.length}</h2></div>
    ${done.length ? `<div class="tbl-wrap"><table><thead><tr><th>Tour</th><th>Vainqueur</th><th>Battue</th><th class="num">Cote du vainqueur</th><th class="num">Paris</th><th class="num">Date</th></tr></thead><tbody>
      ${done.map(m => { const lose = m.winner === m.team_a ? m.team_b : m.team_a; const o = m.winner === m.team_a ? m.odds_a : m.odds_b; return `<tr>
        <td class="mut">${esc(roundName(m.round))}</td><td class="who pos">${esc(tName(m.winner))}</td><td class="mut">${esc(tName(lose))}</td>
        <td class="num">${fOdds(o)}</td><td class="num">${S.bets.filter(b => b.match_id === m.id).length}</td><td class="num mut">${dt(m.decided_at)}</td></tr>`; }).join("")}
    </tbody></table></div>` : emptyBox("史", q ? "Aucun combat ne correspond à ce filtre." : "Aucun combat joué pour l'instant.")}
    </section>
    <section class="sec"><div class="sec-head"><h2>Paris réglés · ${settled.length}</h2></div>
    ${settled.length ? `<div class="tbl-wrap"><table><thead><tr><th>Parieur</th><th>Combat</th><th>Choix</th><th class="num">Mise</th><th class="num">Cote</th><th class="num">Résultat</th></tr></thead>
      <tbody>${betRows(settled, false)}</tbody></table></div>` : emptyBox("両", q ? "Aucun pari ne correspond à ce filtre." : "Aucun pari réglé pour l'instant.")}
    </section>`;
}

    ${su ? `<label class="f"><span class="eyebrow">Grade</span>${gradeSelect("lg-grade", "")}</label>` : ""}

    <section class="sec"><div class="sec-head"><h2>Mes paris · ${mine.length}</h2></div>

      <tbody>${betRows(mine, false)}</tbody></table></div>` : emptyBox("賭", "Tu n'as encore placé aucun pari.")}
